<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2ede2">
<title>熊肯作織布的家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  /* 日本工藝風：生成り紙底＋格子紋、藍染主色、弁柄印記、明朝體標題、近直角形狀 */
  --ground:#f2ede2;--surface:#faf7f0;--kinu:#e4dccb;--ink:#2a2622;--muted:#6a6259;
  --line:#ddd5c6;--line-strong:#8c8275;--grain:#e8e1d3;
  --ai:#23395b;--on-ai:#faf7f0;--bengara:#9a3a24;--on-bengara:#faf7f0;
  --scrim:rgba(42,38,34,.5);--shadow-dialog:0 20px 48px rgba(42,38,34,.16);
  --r-sm:2px;--r-md:4px;--r-lg:6px;--pitch:32px;
  --font-serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background-color:var(--ground);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .36  0 0 0 0 .28  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),linear-gradient(var(--grain) 1px,transparent 1px),linear-gradient(90deg,var(--grain) 1px,transparent 1px);background-size:220px 220px,var(--pitch) var(--pitch),var(--pitch) var(--pitch);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.75;letter-spacing:.02em}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.ann{background:var(--ai);color:var(--on-ai);text-align:center;font-size:13px;letter-spacing:.08em;padding:7px 16px}
header{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line)}
.hin{max-width:1200px;margin:0 auto;padding:18px 20px 10px;display:flex;gap:12px 24px;align-items:flex-end;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto;gap:2px}
.brand a{font-family:var(--font-serif);font-size:24px;font-weight:600;line-height:1.3;color:var(--ink);text-decoration:none;letter-spacing:.16em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.12em}
.search{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line-strong);width:min(320px,100%);padding:0 4px}
.search:focus-within{border-bottom-color:var(--ai);box-shadow:0 1px 0 var(--ai)}
.search svg{flex:none;stroke:var(--muted)}
#q{border:0;background:none;padding:8px 0;flex:1;min-width:0;font-size:14px;outline:none}
#q::placeholder{color:var(--muted)}
.x-unused{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;gap:8px;overflow-x:auto}
.cats button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;white-space:nowrap;color:var(--muted);font-family:var(--font-serif);font-size:15px;letter-spacing:.12em}
.cats button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ai);font-weight:600}
.cats small{margin-left:6px;font-family:var(--font-sans);font-size:12px;letter-spacing:0;font-variant-numeric:tabular-nums;font-weight:400;color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:0 20px 72px}
.sec{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 0 28px}
.kicker{font-family:var(--font-serif);font-size:13px;line-height:20px;font-weight:600;letter-spacing:.3em;color:var(--bengara)}
.sec .h{font-family:var(--font-serif);font-size:24px;line-height:1.5;font-weight:600;letter-spacing:.1em;margin:0;text-wrap:balance}
.rule{display:block;width:32px;height:2px;background:var(--ai);margin:4px 0}
.lbl{font-size:13px;color:var(--muted);letter-spacing:.04em}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:var(--r-sm);padding:3px 12px;font-size:13px;letter-spacing:.04em;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ai);color:var(--on-ai);border-color:var(--ai)}
.chip.pat[aria-pressed="true"]{background:var(--bengara);border-color:var(--bengara);color:var(--on-bengara)}
select{padding:5px 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:36px 24px;margin-top:24px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:28px 12px}.sec{padding:28px 0 20px}}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.pimg{position:relative;display:block;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:10px;transition:border-color .3s}
.card:hover .pimg{border-color:var(--line-strong)}
.pimg img{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--kinu)}
.badge{position:absolute;top:16px;right:16px;font-family:var(--font-serif);font-size:12px;line-height:14px;font-weight:600;letter-spacing:.1em;padding:4px 6px;border-radius:var(--r-sm);border:1px solid var(--bengara);color:var(--bengara);background:var(--surface)}
.badge.sold{background:var(--bengara);color:var(--on-bengara)}
.more{position:absolute;bottom:16px;left:16px;font-size:11px;padding:1px 7px;border-radius:var(--r-sm);background:rgba(27,25,22,.6);color:#faf7f0;letter-spacing:.04em}
.nm{font-family:var(--font-serif);font-size:14px;line-height:1.6;font-weight:500;letter-spacing:.04em}
.pt{font-size:12px;letter-spacing:.08em;color:var(--bengara)}
.pr{font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:0}
.pr.ask{font-weight:400;color:var(--muted);font-size:13px;letter-spacing:.04em}
.empty{padding:72px 20px;text-align:center;color:var(--muted);grid-column:1/-1;font-family:var(--font-serif);letter-spacing:.08em}
footer{border-top:1px solid var(--line);background:var(--ground)}
.fin{max-width:1200px;margin:0 auto;padding:28px 20px;font-size:13px;color:var(--muted);letter-spacing:.06em;display:flex;gap:8px 24px;flex-wrap:wrap;justify-content:space-between}
.ov{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--ground);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-dialog);max-width:1000px;width:100%;max-height:94%;overflow:auto;display:grid;grid-template-columns:1.15fr 1fr}
@media (max-width:760px){.dlg{grid-template-columns:1fr}}
.gal{display:flex;flex-direction:column;gap:8px;padding:16px}
.gal .big{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.gal .big img{width:100%;height:100%;object-fit:contain}
.ths{display:flex;gap:6px;overflow-x:auto}
.ths button{border:1px solid var(--line);padding:2px;border-radius:var(--r-sm);overflow:hidden;cursor:pointer;flex:0 0 64px;height:64px;background:var(--surface)}
.ths button[aria-pressed="true"]{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.ths img{width:100%;height:100%;object-fit:cover}
.info{padding:28px 28px 28px 12px;display:flex;flex-direction:column;gap:16px}
@media (max-width:760px){.info{padding:8px 20px 24px}}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.info h2{font-family:var(--font-serif);font-size:24px;font-weight:600;margin:0;line-height:1.5;letter-spacing:.1em;text-wrap:balance}
.price{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:0}
.price.ask{font-size:15px;font-weight:400;color:var(--muted);letter-spacing:.04em}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}
.spec span:nth-child(odd){color:var(--muted);letter-spacing:.12em}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;letter-spacing:.02em}
.body{white-space:pre-wrap;max-width:40em;line-height:1.85}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;font-size:14px;white-space:pre-wrap}
.btn{border:1px solid var(--line-strong);background:transparent;padding:8px 16px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;letter-spacing:.1em;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--on-ai)}
.btn.link{border-color:transparent;padding-left:0;padding-right:0;color:var(--ai);text-decoration:underline;text-underline-offset:4px;letter-spacing:.04em}
.btn.big{padding:13px 22px;font-size:15px;letter-spacing:.2em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:var(--r-sm);font-size:14px;letter-spacing:.06em;z-index:60}
.demo{background:var(--kinu);color:var(--ink);text-align:center;font-size:13px;padding:6px 16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ---- 頁首導覽 ---- */
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;padding:6px 10px;cursor:pointer;font-family:var(--font-serif);font-size:15px;letter-spacing:.14em;color:var(--muted)}
.nav button:hover{color:var(--ink)}
@media (max-width:720px){.nav{display:none}.hin{padding:14px 16px 10px}}
/* ---- Banner 形象圖 ---- */
.hero{position:relative;height:clamp(340px,52vw,600px);overflow:hidden;background:var(--kinu);border-bottom:1px solid var(--line)}
.hero .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
.hero .slide.on{opacity:1}
.hero .slide img{width:100%;height:100%;object-fit:cover}
.hero .slide.pattern{background-color:var(--ai);background-image:repeating-linear-gradient(90deg,transparent 0 46px,rgba(250,247,240,.16) 46px 49px,transparent 49px 62px,rgba(250,247,240,.1) 62px 64px)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(27,25,22,.62) 0%,rgba(27,25,22,.25) 45%,rgba(27,25,22,0) 70%);pointer-events:none}
@media (max-width:720px){.hero::after{background:linear-gradient(0deg,rgba(27,25,22,.78) 0%,rgba(27,25,22,.45) 55%,rgba(27,25,22,.1) 100%)}}
.hcopy{position:absolute;z-index:2;left:0;right:0;bottom:0;max-width:1200px;margin:0 auto;padding:0 20px clamp(32px,6vw,72px);color:#faf7f0}
.hcopy .kicker{color:#f0c3b2}
.hcopy h1{font-family:var(--font-serif);font-size:clamp(28px,4.6vw,48px);line-height:1.35;font-weight:600;letter-spacing:.16em;margin:10px 0 12px;max-width:14em;text-wrap:balance}
.hcopy p{margin:0 0 24px;max-width:30em;font-size:15px;line-height:1.9;letter-spacing:.06em;color:rgba(250,247,240,.88)}
.hbtn{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(250,247,240,.75);background:transparent;color:#faf7f0;padding:11px 24px;border-radius:var(--r-sm);font-size:14px;letter-spacing:.24em;cursor:pointer}
.hbtn:hover{background:rgba(250,247,240,.12)}
.dots{position:absolute;z-index:2;right:20px;bottom:20px;display:flex;gap:8px}
.dots button{width:22px;height:3px;border:0;padding:0;background:rgba(250,247,240,.4);cursor:pointer}
.dots button[aria-pressed="true"]{background:#faf7f0}
/* ---- 分類卡片 ---- */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:20px}
@media (max-width:520px){.catgrid{grid-template-columns:1fr 1fr;gap:12px}}
.ccard{position:relative;display:flex;flex-direction:column;gap:10px;padding:8px 8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer;text-align:center;color:var(--ink);transition:border-color .25s,transform .25s}
.ccard:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.ccard[aria-pressed="true"]{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.ccard .cimg{aspect-ratio:1/1;overflow:hidden;background:var(--kinu)}
.ccard .cimg img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.ccard:hover .cimg img{transform:scale(1.05)}
.ccard .cimg.all{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.ccard .cimg.all img{aspect-ratio:1/1}
.ccard .ck{font-family:var(--font-serif);font-size:12px;letter-spacing:.3em;color:var(--bengara)}
.ccard .cn{font-family:var(--font-serif);font-size:17px;font-weight:600;letter-spacing:.14em;line-height:1.4}
.ccard .cc{font-size:12px;color:var(--muted);letter-spacing:.06em}
.ccard[aria-pressed="true"] .cc::before{content:"● ";color:var(--ai)}
/* ---- 照片放大 ---- */
.pimg .zw{display:block;overflow:hidden;background:var(--kinu)}
.pimg .zw img{transition:transform .5s ease}
.card:hover .pimg .zw img{transform:scale(1.06)}
/* 對話框：圓形放大鏡 */
.gal .big{position:relative;cursor:crosshair;touch-action:none}
.lens{position:absolute;width:180px;height:180px;border-radius:50%;pointer-events:none;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong),0 8px 24px rgba(42,38,34,.28);background-repeat:no-repeat;background-color:var(--surface);transform:translate(-50%,-50%);opacity:0;transition:opacity .15s;z-index:3}
.lens.on{opacity:1}
@media (max-width:520px){.lens{width:140px;height:140px}}
.zhint{font-size:12px;color:var(--muted);letter-spacing:.06em;text-align:center}
/* ---- 關於我們／店家資訊 ---- */
.about{border-top:1px solid var(--line);background:var(--surface)}
.ain{max-width:1200px;margin:0 auto;padding:8px 20px 56px;display:grid;grid-template-columns:1.1fr 1fr;gap:40px 64px}
@media (max-width:760px){.ain{grid-template-columns:1fr;gap:32px}}
.ain .sec{grid-column:1/-1;padding-bottom:8px}
.story h3,.info2 h3{font-family:var(--font-serif);font-size:18px;font-weight:600;letter-spacing:.14em;margin:0 0 12px}
.story p{margin:0;white-space:pre-wrap;line-height:1.95;max-width:34em}
.clist{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;margin:0;font-size:14px}
.clist dt{color:var(--muted);letter-spacing:.14em;white-space:nowrap}
.clist dd{margin:0;word-break:break-word}
.clist a{color:var(--ai);text-underline-offset:4px}
.social{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.social a{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 16px;color:var(--ink);text-decoration:none;font-size:14px;letter-spacing:.08em}
.social a:hover{border-color:var(--ai);color:var(--ai)}
.social svg{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sec.home{padding-top:56px}

/* ---- 手作感細節 ---- */
:root{--stitch:#b9ad99}
.surface-paper,.ccard,.pimg,.about,.dlg,.contact{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .36  0 0 0 0 .28  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");background-size:220px 220px}
/* 分類卡片內圈：刺し子縫線 */
.ccard::after{content:"";position:absolute;inset:4px;border:1px dashed var(--stitch);border-radius:2px;pointer-events:none;opacity:.8}
.ccard[aria-pressed="true"]::after{border-color:var(--ai);opacity:.6}
/* 標題下的短線改成手縫線 */
.rule{width:44px;height:0;background:none;border-top:2px dashed var(--ai);opacity:.85}
/* 關於我們上緣一道縫線 */
.about{position:relative}
.about::before{content:"";position:absolute;left:0;right:0;top:6px;border-top:1px dashed var(--stitch)}
/* 照片襯紙微微不規則，像手裱的 */
.grid .card:nth-child(3n+1) .pimg{transform:rotate(-.35deg)}
.grid .card:nth-child(3n+2) .pimg{transform:rotate(.3deg)}
.card:hover .pimg{transform:none}
.pimg{transition:border-color .3s,transform .3s}
/* 印記徽章略帶手蓋的歪斜 */
.badge{transform:rotate(-3deg)}
/* 頁首背景與紙底一致 */
header{background-color:rgba(242,237,226,.94);backdrop-filter:blur(6px)}
</style>
</head>
<body>
<div class="demo" id="demo" hidden>示範模式：目前顯示的是假商品與示範店家資訊。在 config.js 填入資料庫網址後就會顯示真的內容。</div>
<div class="ann" id="ann" hidden></div>
<header>
  <div class="hin">
    <div class="brand"><a href="#" id="name">熊肯作織布的家</a><span id="tag"></span></div>
    <nav class="nav" aria-label="頁面導覽"><button data-go="catsec">商品分類</button><button data-go="products">商品一覽</button><button data-go="about">關於我們</button></nav>
    <label class="search"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg><input type="search" id="q" placeholder="搜尋商品、紋樣、商品編號" aria-label="搜尋商品"></label>
  </div>
</header>

<section class="hero" id="hero" aria-label="形象圖">
  <div id="slides"></div>
  <div class="hcopy">
    <span class="kicker" id="hK">手織 · 工房</span>
    <h1 id="hT"></h1>
    <p id="hS"></p>
    <button class="hbtn" data-go="catsec">看看作品<span aria-hidden="true">→</span></button>
  </div>
  <div class="dots" id="dots"></div>
</section>

<main>
  <section id="catsec">
    <div class="sec home"><span class="kicker">壹 · 分類</span><h2 class="h">商品分類</h2><span class="rule"></span><span class="lbl">選一個分類，看看這一類的作品</span></div>
    <div class="catgrid" id="cats"></div>
  </section>
  <section id="products">
    <div class="sec home"><span class="kicker" id="secK">貳 · 作品</span><h2 class="h" id="secT">全部商品</h2><span class="rule"></span><span class="lbl" id="count"></span></div>
    <div class="bar">
      <div class="chips" id="subs"></div>
      <label class="lbl" for="sort" style="display:flex;gap:6px;align-items:center">排序
        <select id="sort"><option value="new">最新上架</option><option value="low">價格低到高</option><option value="high">價格高到低</option></select>
      </label>
    </div>
    <div class="bar"><div class="chips" id="pats"></div></div>
    <div class="grid" id="grid"><div class="empty">商品載入中…</div></div>
  </section>
</main>

<section class="about" id="about">
  <div class="ain">
    <div class="sec home"><span class="kicker">參 · 關於</span><h2 class="h">關於我們</h2><span class="rule"></span></div>
    <div class="story"><h3 id="aName"></h3><p id="aStory"></p></div>
    <div class="info2"><h3>聯絡與造訪</h3><dl class="clist" id="aList"></dl><div class="social" id="aSocial"></div></div>
  </div>
</section>
<footer><div class="fin" id="foot"></div></footer>

<div class="ov" id="ov" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <div class="gal"><div class="big" id="pBigBox"><img id="pBig" alt=""><div class="lens" id="pLens" aria-hidden="true"></div></div><div class="zhint" id="pHint"></div><div class="ths" id="pThs"></div></div>
    <div class="info">
      <div class="top"><span class="kicker" id="pCat"></span><button class="btn" id="pClose">關閉</button></div>
      <h2 id="pTitle"></h2>
      <div class="price" id="pPrice"></div>
      <div class="spec" id="pSpec"></div>
      <div class="body" id="pBody"></div>
      <button class="btn primary big" id="pAsk">詢問購買</button>
      <div class="contact" id="pContact" hidden></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const API=(window.SHOP_API_URL||"").trim();
let S={},CATS=[],PRODUCTS=[];
let selMain="",selCat="",selPat="";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"NT$ "+Number(n).toLocaleString("zh-TW");
const NUM=["壹","貳","參","肆","伍","陸","柒","捌","玖","拾","拾壹","拾貳"];
const FINE=matchMedia("(hover:hover) and (pointer:fine)").matches;
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function go(id){const el=$(id);if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
$("name").onclick=e=>{e.preventDefault();window.scrollTo({top:0,behavior:"smooth"})};

/* Google 雲端硬碟照片網址（主要＋備用） */
const isURL=id=>/^(data:|blob:|https?:)/.test(id);
function imgURL(id,w){return isURL(id)?id:`https://lh3.googleusercontent.com/d/${id}=w${w}`}
function imgTag(id,w,alt,lazy,attrs){
  if(!id) return `<img alt="${esc(alt)}">`;
  const fb=isURL(id)?"":`this.onerror=null;this.src='https://drive.google.com/thumbnail?id=${esc(id)}&sz=w${w}'`;
  return `<img src="${esc(imgURL(id,w))}" alt="${esc(alt)}"${lazy?' loading="lazy"':""}${fb?` onerror="${fb}"`:""}${attrs||""}>`;
}
function setImg(el,id,w){el.onerror=null;el.src=imgURL(id,w);if(!isURL(id))el.onerror=()=>{el.onerror=null;el.src=`https://drive.google.com/thumbnail?id=${id}&sz=w${w}`}}
const list2=v=>{v=String(v||"");return v.split(v.includes("data:")?/\n+/:/[\n,，]+/).map(x=>x.trim()).filter(Boolean)};
const safeLink=v=>/^https:\/\//i.test(String(v||"").trim())?String(v).trim():"";

const catOf=code=>CATS.find(c=>c.code===code);
function productName(p){
  if(p.name) return p.name;
  const c=catOf(p.cat);
  return (p.pattern?p.pattern+" ":"")+(c?c.name:"")||p.code;
}
const hasPrice=p=>p.price!==null&&p.price!==""&&p.price!==undefined&&!isNaN(p.price);

/* ---- Banner ---- */
let heroTimer;
function renderHero(){
  const store=S["店名"]||"熊肯作織布的家";
  $("hK").textContent=S["形象小標"]||"手織 · 工房";
  $("hT").textContent=S["形象標題"]||store;
  $("hS").textContent=S["形象副標"]||S["標語"]||"";
  $("hS").hidden=!$("hS").textContent;
  const imgs=list2(S["形象圖"]);
  $("slides").innerHTML=imgs.length?imgs.map((id,i)=>`<div class="slide${i?"":" on"}">${imgTag(id,2000,i?"":store,false)}</div>`).join(""):`<div class="slide pattern on"></div>`;
  const sl=[...$("slides").children];
  $("dots").innerHTML=sl.length>1?sl.map((_,i)=>`<button aria-label="第 ${i+1} 張形象圖" aria-pressed="${!i}"></button>`).join(""):"";
  let cur=0;const show=i=>{cur=(i+sl.length)%sl.length;sl.forEach((s,j)=>s.classList.toggle("on",j===cur));$("dots").querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-pressed",j===cur))};
  $("dots").querySelectorAll("button").forEach((b,i)=>b.onclick=()=>{show(i);restart()});
  const restart=()=>{clearInterval(heroTimer);if(sl.length>1&&!matchMedia("(prefers-reduced-motion: reduce)").matches)heroTimer=setInterval(()=>show(cur+1),6000)};
  restart();
}

/* ---- 關於我們 ---- */
const IC={
  fb:'<svg width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M15 8h-1.5A2.5 2.5 0 0 0 11 10.5V21M8.5 13H15"/></svg>',
  ig:'<svg width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6"/></svg>',
  line:'<svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 4C7 4 3 7.2 3 11.1c0 3.5 3.1 6.4 7.4 7l-.4 2.4 3.4-2.3c4.5-.4 7.6-3.4 7.6-7.1C21 7.2 17 4 12 4z"/></svg>'
};
function renderAbout(){
  const store=S["店名"]||"熊肯作織布的家";
  $("aName").textContent=store;
  $("aStory").textContent=S["店家介紹"]||S["標語"]||"";
  const rows=[];
  if(S["地址"]) rows.push(["地址",`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(S["地址"])}" target="_blank" rel="noopener">${esc(S["地址"])}</a>`]);
  if(S["營業時間"]) rows.push(["時間",`<span style="white-space:pre-wrap">${esc(S["營業時間"])}</span>`]);
  if(S["電話"]) rows.push(["電話",`<a href="tel:${esc(String(S["電話"]).replace(/[^\d+]/g,""))}">${esc(S["電話"])}</a>`]);
  if(S["Email"]&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S["Email"])) rows.push(["Email",`<a href="mailto:${esc(S["Email"])}">${esc(S["Email"])}</a>`]);
  if(S["LINE"]&&!safeLink(S["LINE"])) rows.push(["LINE",esc(S["LINE"])]);
  $("aList").innerHTML=rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("");
  const soc=[["Facebook",safeLink(S["Facebook"]),IC.fb],["Instagram",safeLink(S["Instagram"]),IC.ig],["LINE",safeLink(S["LINE"]),IC.line]].filter(x=>x[1]);
  $("aSocial").innerHTML=soc.map(([n,u,ic])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${ic}${esc(n)}</a>`).join("");
  $("about").hidden=!($("aStory").textContent||rows.length||soc.length);
}

function render(){
  const store=S["店名"]||"熊肯作織布的家";
  document.title=store;
  $("name").textContent=store;
  $("tag").textContent=S["標語"]||"";
  $("ann").hidden=!S["公告"];$("ann").textContent=S["公告"]||"";
  $("foot").innerHTML=`<span>${esc(S["頁尾"]||("© "+new Date().getFullYear()+" "+store))}</span><span>詢問購買時請附上商品編號</span>`;
  // 大類卡片
  const mains=[];
  for(const c of CATS){if(!mains.some(m=>m.main===c.main))mains.push({main:c.main,name:c.mainName})}
  const inM=m=>PRODUCTS.filter(p=>(catOf(p.cat)||{}).main===m);
  const navs=[{k:"",name:"全部",list:PRODUCTS},...mains.map(m=>({k:m.main,name:m.name,list:inM(m.main)})).filter(m=>m.list.length)];
  if(!navs.some(n=>n.k===selMain)) selMain="";
  const cover=n=>{const c=n.list.find(p=>p.photos&&p.photos[0]);return c?c.photos[0]:""};
  $("cats").innerHTML=navs.map((n,i)=>{
    let im;
    if(!n.k){const ph=navs.slice(1,5).map(cover).filter(Boolean);while(ph.length<4&&PRODUCTS[ph.length])ph.push(PRODUCTS[ph.length].photos[0]);im=`<span class="cimg all">${ph.slice(0,4).map(id=>imgTag(id,300,"",true)).join("")}</span>`}
    else im=`<span class="cimg">${imgTag(cover(n),500,n.name,true)}</span>`;
    return `<button class="ccard" data-k="${esc(n.k)}" aria-pressed="${n.k===selMain}">${im}<span class="ck">${i?NUM[i-1]||i:"總覽"}</span><span class="cn">${esc(n.name)}</span><span class="cc">${n.list.length} 件</span></button>`;
  }).join("");
  $("cats").querySelectorAll(".ccard").forEach(b=>b.onclick=()=>{selMain=b.dataset.k;selCat="";selPat="";render();go("products")});
  const inMain=PRODUCTS.filter(p=>!selMain||(catOf(p.cat)||{}).main===selMain);
  // 類別
  const subs=selMain?CATS.filter(c=>c.main===selMain).map(c=>({k:c.code,name:c.name,n:inMain.filter(p=>p.cat===c.code).length})).filter(s=>s.n):[];
  if(!subs.some(s=>s.k===selCat)) selCat="";
  $("subs").innerHTML=subs.length>1?[`<button class="chip" data-k="" aria-pressed="${!selCat}">全部</button>`,...subs.map(s=>`<button class="chip" data-k="${esc(s.k)}" aria-pressed="${s.k===selCat}">${esc(s.name)}</button>`)].join(""):"";
  $("subs").querySelectorAll("button").forEach(b=>b.onclick=()=>{selCat=b.dataset.k;render()});
  const inCat=inMain.filter(p=>!selCat||p.cat===selCat);
  const mi=navs.findIndex(n=>n.k===selMain);
  $("secK").textContent=selMain?`${NUM[mi-1]||mi} · ${navs[mi].name}`:"貳 · 作品";
  $("secT").textContent=selCat?(catOf(selCat)||{}).name||"":selMain?navs[mi].name:"全部商品";
  // 織紋
  const pats=[...new Set(inCat.map(p=>p.pattern).filter(Boolean))];
  if(!pats.includes(selPat)) selPat="";
  $("pats").innerHTML=pats.length?[`<span class="lbl">織紋</span>`,`<button class="chip pat" data-k="" aria-pressed="${!selPat}">不限</button>`,...pats.map(t=>`<button class="chip pat" data-k="${esc(t)}" aria-pressed="${t===selPat}">${esc(t)}</button>`)].join(""):"";
  $("pats").querySelectorAll("button").forEach(b=>b.onclick=()=>{selPat=b.dataset.k;render()});
  let list=inCat.filter(p=>!selPat||p.pattern===selPat);
  const q=$("q").value.trim().toLowerCase();
  if(q) list=list.filter(p=>[productName(p),p.code,p.desc,(p.tags||[]).join(" "),p.pattern,(catOf(p.cat)||{}).name].join(" ").toLowerCase().includes(q));
  const sort=$("sort").value;
  list.sort((a,b)=>{
    if(sort==="new") return String(b.created).localeCompare(String(a.created))||a.code.localeCompare(b.code);
    const pa=hasPrice(a)?+a.price:null,pb=hasPrice(b)?+b.price:null;
    if(pa==null&&pb==null)return 0;if(pa==null)return 1;if(pb==null)return -1;
    return sort==="low"?pa-pb:pb-pa;
  });
  $("count").textContent=PRODUCTS.length?`${list.length} 件商品`:"";
  renderAbout();
  const g=$("grid");
  if(!PRODUCTS.length){g.innerHTML=`<div class="empty">商品準備中，請稍後再來看看。</div>`;return}
  if(!list.length){g.innerHTML=`<div class="empty">沒有符合的商品，換個分類或關鍵字試試。</div>`;return}
  g.innerHTML=list.map(p=>{
    const st=p.status==="售完"?'<span class="badge sold">售完</span>':p.status==="預購"?'<span class="badge">預購</span>':"";
    return `<button class="card" data-code="${esc(p.code)}"><span class="pimg"><span class="zw">${imgTag(p.photos[0],800,productName(p),true)}</span>${st}${p.photos.length>1?`<span class="more">${p.photos.length} 張</span>`:""}</span>
      <span class="nm">${esc(productName(p))}</span>${p.pattern?`<span class="pt">${esc(p.pattern)}</span>`:""}
      ${hasPrice(p)?`<span class="pr">${money(p.price)}</span>`:`<span class="pr ask">價格請洽詢</span>`}</button>`;
  }).join("");
  g.querySelectorAll(".card").forEach(b=>{
    b.onclick=()=>{location.hash=b.dataset.code};
  });
}
$("q").oninput=()=>{render()};
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")go("products")});
$("sort").onchange=render;

/* 對話框大圖：圓形放大鏡，跟著滑鼠（手機用手指按住拖動） */
const bigBox=$("pBigBox"),bigImg=$("pBig"),lens=$("pLens");
const ZOOM=2.5;
function lensAt(cx,cy){
  const box=bigBox.getBoundingClientRect(),ir=bigImg.getBoundingClientRect();
  const nw=bigImg.naturalWidth,nh=bigImg.naturalHeight;
  if(!nw||!nh){lens.classList.remove("on");return}
  // 圖片用 contain 排版，算出實際畫面上的圖片範圍
  const sc=Math.min(ir.width/nw,ir.height/nh),w=nw*sc,h=nh*sc,l=ir.left+(ir.width-w)/2,t=ir.top+(ir.height-h)/2;
  const x=cx-l,y=cy-t;
  if(x<0||y<0||x>w||y>h){lens.classList.remove("on");return}
  const r=lens.offsetWidth/2;
  lens.style.left=(cx-box.left)+"px";lens.style.top=(cy-box.top)+"px";
  lens.style.backgroundImage=`url("${bigImg.currentSrc||bigImg.src}")`;
  lens.style.backgroundSize=`${w*ZOOM}px ${h*ZOOM}px`;
  lens.style.backgroundPosition=`${r-x*ZOOM}px ${r-y*ZOOM}px`;
  lens.classList.add("on");
}
bigBox.addEventListener("pointermove",e=>lensAt(e.clientX,e.clientY));
bigBox.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"){bigBox.setPointerCapture(e.pointerId)}lensAt(e.clientX,e.clientY)});
["pointerleave","pointerup","pointercancel"].forEach(ev=>bigBox.addEventListener(ev,e=>{if(ev!=="pointerup"||e.pointerType!=="mouse")lens.classList.remove("on")}));
$("pHint").textContent=FINE?"滑鼠移到照片上，用放大鏡看細節":"手指按住照片並移動，用放大鏡看細節";

function openProduct(code){
  const p=PRODUCTS.find(x=>x.code===code);
  if(!p){if(PRODUCTS.length){toast("找不到這件商品，可能已下架");history.replaceState(null,"",location.pathname+location.search)}return}
  const show=k=>{lens.classList.remove("on");setImg(bigImg,p.photos[k],1600);bigImg.alt=productName(p);$("pThs").querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-pressed",j===k))};
  $("pThs").innerHTML=p.photos.length>1?p.photos.map((id,k)=>`<button aria-label="第 ${k+1} 張">${imgTag(id,160,"",false)}</button>`).join(""):"";
  $("pThs").querySelectorAll("button").forEach((b,k)=>b.onclick=()=>show(k));
  show(0);
  const c=catOf(p.cat);
  $("pCat").textContent=c?c.mainName+" · "+c.name:"";
  $("pTitle").textContent=productName(p);
  $("pPrice").textContent=hasPrice(p)?money(p.price):"價格請洽詢";$("pPrice").className="price"+(hasPrice(p)?"":" ask");
  const spec=[["商品編號",p.code],["狀態",p.status||"現貨"],p.pattern&&["織紋",p.pattern],(p.tags||[]).length&&["標籤",p.tags.join("、")]].filter(Boolean);
  $("pSpec").innerHTML=spec.map(([k,v])=>`<span>${esc(k)}</span><span${k==="商品編號"?' class="code"':""}>${esc(v)}</span>`).join("");
  $("pBody").textContent=p.desc||"";
  const sold=p.status==="售完";
  $("pAsk").disabled=sold;$("pAsk").textContent=sold?"已售完":"詢問購買";
  $("pContact").hidden=true;
  $("pAsk").onclick=()=>{
    const link=safeLink(S["聯絡連結"]);
    const box=$("pContact");
    box.innerHTML=`<div>${esc(S["聯絡說明"]||"請透過下方方式與我們聯絡。")}</div><div style="margin-top:8px">商品編號 <b class="code">${esc(p.code)}</b></div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;align-items:center"><button class="btn" id="pCopy">複製商品編號</button>${link?`<a class="btn link" href="${esc(link)}" target="_blank" rel="noopener">${esc(S["聯絡按鈕文字"]||"前往聯絡")}</a>`:""}</div>`;
    box.hidden=false;
    $("pCopy").onclick=async()=>{try{await navigator.clipboard.writeText(p.code+" "+productName(p));toast("已複製商品編號")}catch{toast("請手動記下 "+p.code)}};
  };
  $("ov").hidden=false;$("pClose").focus();
}
function closeProduct(){$("ov").hidden=true;if(location.hash)history.replaceState(null,"",location.pathname+location.search)}
$("pClose").onclick=closeProduct;
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))closeProduct()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("ov").hidden)closeProduct()});
function route(){const h=decodeURIComponent(location.hash.slice(1));if(h)openProduct(h);else $("ov").hidden=true}
window.addEventListener("hashchange",route);

/* 示範資料 */
function demo(){
  const swatch=(i,w=480,h=600)=>{const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");const hues=[355,215,30,160,280,10];x.fillStyle=`hsl(${hues[i%6]},42%,${38+(i%3)*6}%)`;x.fillRect(0,0,w,h);x.strokeStyle="rgba(255,255,255,.85)";x.lineWidth=5;
    for(let r=0;r<h/60+1;r++)for(let k=0;k<w/90+1;k++){const cx=k*90+(r%2?45:0),cy=r*66;x.beginPath();x.moveTo(cx,cy-28);x.lineTo(cx+30,cy);x.lineTo(cx,cy+28);x.lineTo(cx-30,cy);x.closePath();x.stroke()}
    return c.toDataURL("image/jpeg",.8)};
  const cats=[["A","包包","AA","後背包"],["A","包包","AB","側背包"],["A","包包","AE","零錢包"],["B","飾品","BA","耳環"],["B","飾品","BF","手鍊"],["C","衣服","CB","背心"],["D","造型編織物","DB","娃娃"],["E","圍巾","EA","長巾"]];
  CATS=cats.map((c,i)=>({main:c[0],mainName:c[1],code:c[2],name:c[3],show:true,order:i}));
  const items=[["AB001","菱紋手織側背包",1680,"現貨","菱紋織"],["AB002","",1280,"預購","斜紋織"],["AA001","山紋後背包",2480,"現貨","山形紋"],["AE003","小零錢包",380,"售完","菱形紋"],["BA001","織帶耳環",450,"現貨",""],["BF002","手鍊",null,"現貨","線條紋"],["CB004","傳統紋樣背心",3200,"現貨","菱紋織"],["DB010","織布娃娃",680,"預購",""],["EA002","長巾",1500,"現貨","平織"]];
  PRODUCTS=items.map((it,i)=>({code:it[0],cat:it[0].slice(0,2),name:it[1],price:it[2],status:it[3],listed:true,pattern:it[4],desc:"手工織布製作，每件紋樣略有不同。",tags:["手織"],photos:i===0?[swatch(i),swatch(i+3)]:[swatch(i)],created:new Date(Date.now()-i*864e5).toISOString()}));
  S={"店名":"熊肯作織布的家","標語":"手織布與織品商品","聯絡說明":"喜歡的商品請記下商品編號，透過下方方式與我們聯絡。",
    "形象圖":[swatch(1,1600,900),swatch(4,1600,900)].join("\n"),"形象標題":"一線一線，織進日常","形象副標":"以手工織機慢慢織成的包、巾與飾品，每一件紋樣都略有不同。",
    "店家介紹":"（示範文字）我們是一間小小的織布工房，延續傳統織紋，把它們做成每天都能使用的生活用品。歡迎預約來工房看看織機。",
    "地址":"（示範）請在設定填入地址","營業時間":"週二至週六 10:00–17:00\n週日、週一公休","電話":"(示範) 0900-000-000","Email":"hello@example.com",
    "Facebook":"https://www.facebook.com/","Instagram":"https://www.instagram.com/"};
}

(async()=>{
  if(!API){$("demo").hidden=false;demo();renderHero();render();route();return}
  try{
    const r=await fetch(API+(API.includes("?")?"&":"?")+"action=shop");
    const d=await r.json();
    if(!d.ok) throw new Error(d.error||"讀取失敗");
    S=d.settings||{};CATS=d.categories||[];PRODUCTS=(d.products||[]).filter(p=>p.photos&&p.photos.length);
    renderHero();render();route();
  }catch(e){
    renderHero();
    $("grid").innerHTML=`<div class="empty">商品暫時無法載入，請稍後重新整理。</div>`;
  }
})();
</script>
</body>
